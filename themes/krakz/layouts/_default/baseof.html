<!doctype html>
<html lang="{{ site.Language.LanguageCode | default "en" }}">
<head>
  {{- partial "head.html" . }}
</head>
<body class="{{ block "bodyclass" . }}page{{ end }}">
  <a class="skip-link" href="#main">Skip to content</a>
  {{ partial "header.html" . }}
  <main id="main" class="site-main">
    {{- block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{- $js := resources.Get "js/main.js" | resources.Minify | resources.Fingerprint }}
  <script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" data-search-index="{{ "index.json" | relURL }}" defer></script>
</body>
</html>
