{{ define "bodyclass" }}page page--terms{{ end }}
{{ define "main" }}
<header class="page-head container">
  <h1 class="page-head__title">{{ .Title }}</h1>
  <p class="page-head__lead">{{ len .Pages }} {{ lower .Title }} across the blog.</p>
</header>
<section class="container">
  <ul class="term-cloud">
    {{- range .Pages.ByTitle }}
    <li><a class="chip chip--link" href="{{ .RelPermalink }}">{{ if eq $.Data.Plural "tags" }}#{{ end }}{{ .Title }} <span class="chip__count">{{ len .Pages }}</span></a></li>
    {{- end }}
  </ul>
</section>
{{ end }}
